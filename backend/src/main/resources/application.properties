
spring.application.name=warehouse
server.port=8080


spring.datasource.url=jdbc:mysql://localhost:3306/warehouse_db
spring.datasource.username=warehouse_app
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/warehouse_db}
#spring.datasource.username=${DB_USERNAME:warehouse_app}
#spring.datasource.password=${DB_PASSWORD:}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#Tạo biến môi trường MAIL_USERNAME và MAIL_PASSWORD. MAIL_PASSWORD phải là Google App Password,
# không phải mật khẩu đăng nhập Gmail thông thường. Cần bật xác minh 2 bước cho tài khoản Google.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
